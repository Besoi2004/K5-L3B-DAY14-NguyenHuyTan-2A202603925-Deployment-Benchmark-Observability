# Quality gate (Exercise 7.3): mỗi pull request chạy eval trên golden dataset.
# run_eval.py trả exit code 1 khi accuracy < ngưỡng hoặc có câu bị regression so với baseline
# → step fail → job fail → (bật branch protection "require status checks") PR không merge được.
name: quality-gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/develop/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Start agent v2 (tắt lỗi ngẫu nhiên để eval ổn định)
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 PORT=8000 python app.py > agent.log 2>&1 &
          for i in $(seq 1 40); do curl -sf localhost:8000/health && exit 0; sleep 0.5; done
          cat agent.log; exit 1
      - name: Eval + quality gate
        run: |
          python eval/run_eval.py --url http://localhost:8000 \
            --min-accuracy 0.85 \
            --baseline reports/eval_v2_fixed.json \
            --out eval_ci.json
