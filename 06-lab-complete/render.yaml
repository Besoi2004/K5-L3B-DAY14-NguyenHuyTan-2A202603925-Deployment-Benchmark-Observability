# ============================================================
# Render Blueprint — agent (Docker) + Redis (Key Value)
# Render Dashboard → New → Blueprint → chọn repo, Blueprint path: 06-lab-complete/render.yaml
# AGENT_API_KEY nhập tay trên dashboard (sync: false) — không ghi giá trị ở đây.
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: LOG_LEVEL
        value: INFO

  - type: keyvalue
    name: day14-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # chỉ service trong cùng tài khoản Render truy cập được
