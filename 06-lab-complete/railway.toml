# Railway — dự phòng (nền tảng chính dùng render.yaml)
# Biến môi trường (AGENT_API_KEY, REDIS_URL...) đặt trên dashboard / `railway variables`, không ghi ở đây.
# PORT do Railway cấp, CMD trong Dockerfile đọc ${PORT:-8000}.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
